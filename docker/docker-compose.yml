# Local-development draft, not a production deployment.
# Image versions checked against published releases on 2026-11-13; no prereleases.
# Setup: copy .env.example to .env and change POSTGRES_PASSWORD.
# Run from this directory: docker compose up --build -d
# Or from the repository root: make help (individual services skip dependencies).
# Frontend runs a standalone demo chat. Django backend serves GET /api/.
# RAG still needs an app.py entrypoint and dependency installation.
# Backend tests: docker compose run --rm --no-deps backend python manage.py test
# Frontend-only development: cd ../srcs/frontend && npm ci && npm run dev
# Application ports and environment variable names below are proposed contracts.
# Frontend/backend/RAG must listen on 0.0.0.0 at their respective container ports.

services:
  nginx:
    image: nginx:1.31.8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag42}
      POSTGRES_USER: ${POSTGRES_USER:-rag42}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9.19.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in docker/.env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.5.6}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Authentication/TLS are disabled only for this private development stack.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.5.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch:
        condition: service_healthy

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # CPU-only by default. Pull a model after startup:
    # docker compose exec ollama ollama pull <model>

  frontend:
    build:
      context: ../srcs/frontend
    restart: unless-stopped
    expose:
      - "3000"
    # Browser API requests use /api/ through the backend; RAG is internal-only.

  backend:
    build:
      context: ../srcs/backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rag42}
      POSTGRES_USER: ${POSTGRES_USER:-rag42}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      RAG_URL: http://rag:8000
    depends_on:
      postgres:
        condition: service_healthy
      rag:
        condition: service_started

  rag:
    build:
      context: ../srcs/RAG
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
  elasticsearch_data:
  ollama_data:
